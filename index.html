<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flora Studio - Lindenmayer 식물 성장 시뮬레이터</title>
  <meta name="description" content="nylki/lindenmayer 기반의 무작위 유전적 식물 성장 및 바람 물리를 시뮬레이션하는 인터랙티브 HTML5 캔버스 인터페이스">
  
  <!-- Web Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-parchment">
  <div id="app-container">
    <!-- Interactive Canvas Viewport -->
    <div id="canvas-viewport" title="드래그하여 이동, 휠을 굴려 확대/축소할 수 있습니다.">
      <canvas id="tree-canvas"></canvas>
      <canvas id="particle-canvas"></canvas>
    </div>

    <!-- Top Left Title (No Box) -->
    <h1 id="app-title">FLORA</h1>

    <!-- Right Sidebar: Controls & Custom Rules -->
    <aside id="sidebar-right" class="glass-panel">
      <!-- Species Selector at the Top -->
      <div class="control-group" style="padding-bottom: 8px; border-bottom: 1px solid var(--panel-border);">
        <div class="control-label-row" style="margin-bottom: 4px;">
          <span style="font-weight: 700; color: var(--accent-green); font-size: 0.82rem;">식물 종 선택</span>
        </div>
        <select id="select-preset" class="code-editor" style="height: 38px; padding: 6px 10px; font-size: 0.84rem; font-weight: 600;">
          <!-- Options injected via JavaScript -->
        </select>
      </div>

      <!-- Section 1: Plant Genetics -->
      <div class="accordion-item">
        <div class="accordion-header">
          <span>🧬 형태 및 유전 파라미터</span>
          <span class="toggle-icon">▾</span>
        </div>
        <div class="accordion-content">
          <div class="control-group">
            <div class="control-label-row">
              <span>가지 분기 각도</span>
              <span id="val-angle" class="control-value-badge">25°</span>
            </div>
            <input type="range" id="slider-angle" min="10" max="60" step="0.5" value="25">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>무작위 각도 편차 (Jitter)</span>
              <span id="val-angle-var" class="control-value-badge">±8°</span>
            </div>
            <input type="range" id="slider-angle-var" min="0" max="25" step="0.5" value="8">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>초기 줄기 길이</span>
              <span id="val-length" class="control-value-badge">28px</span>
            </div>
            <input type="range" id="slider-length" min="10" max="60" step="1" value="28">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>가지 길이 감쇠비 (Decay)</span>
              <span id="val-decay" class="control-value-badge">0.72</span>
            </div>
            <input type="range" id="slider-decay" min="0.5" max="0.95" step="0.01" value="0.72">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>성장 세대 (Iterations)</span>
              <span id="val-iterations" class="control-value-badge">4</span>
            </div>
            <input type="range" id="slider-iterations" min="1" max="6" step="1" value="4">
          </div>
        </div>
      </div>

      <!-- Section 2: Environment & Physics -->
      <div class="accordion-item">
        <div class="accordion-header">
          <span>🍃 환경 및 물리 동역학</span>
          <span class="toggle-icon">▾</span>
        </div>
        <div class="accordion-content">
          <div class="control-group">
            <div class="control-label-row">
              <span>성장 속도</span>
              <span id="val-growth-speed" class="control-value-badge">8</span>
            </div>
            <input type="range" id="slider-growth-speed" min="0.001" max="0.03" step="0.001" value="0.008">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>바람 흔들림 세기</span>
              <span id="val-wind" class="control-value-badge">4%</span>
            </div>
            <input type="range" id="slider-wind" min="0.0" max="0.12" step="0.005" value="0.04">
          </div>

          <div class="toggle-row">
            <span>바람 시뮬레이션 적용</span>
            <label class="switch">
              <input type="checkbox" id="toggle-wind" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>

          <div class="toggle-row">
            <span>잎사귀 (Leaves) 표시</span>
            <label class="switch">
              <input type="checkbox" id="toggle-leaves" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>

          <div class="toggle-row">
            <span>꽃 / 열매 (Blossoms) 표시</span>
            <label class="switch">
              <input type="checkbox" id="toggle-flowers" checked>
              <span class="slider-toggle"></span>
            </label>
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>배경 및 조명 테마</span>
            </div>
            <select id="select-theme" class="code-editor" style="height: 36px; padding: 4px 8px;">
              <option value="parchment" selected>식물 도감 화폭 (Botanical Light)</option>
              <option value="midnight">심야 다크 (Midnight Dark)</option>
              <option value="sunset">노을빛 정원 (Sunset Purple)</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Section 3: Advanced L-System Rule Editor (Hidden for now) -->
      <div class="accordion-item" style="display: none;">
        <div class="accordion-header">
          <span>🧪 Lindenmayer 규칙 편집기</span>
          <span class="toggle-icon">▾</span>
        </div>
        <div class="accordion-content">
          <div class="control-group">
            <div class="control-label-row">
              <span>Axiom (시작 기호)</span>
            </div>
            <input type="text" id="input-axiom" class="code-editor" style="height: 34px; padding: 6px;" value="X">
          </div>

          <div class="control-group">
            <div class="control-label-row">
              <span>Productions (확률적 생성 규칙 JSON)</span>
            </div>
            <textarea id="input-rules" class="code-editor" rows="6"></textarea>
          </div>

          <button id="btn-apply-rules" class="dock-btn" style="width: 100%; justify-content: center; background: rgba(16, 185, 129, 0.2); border-color: var(--accent-green); color: var(--accent-green);">
            ✓ 커스텀 규칙 적용하기
          </button>
        </div>
      </div>
    </aside>

    <!-- Bottom Floating Dock -->
    <div id="dock-bottom" class="glass-panel">
      <button id="btn-play-pause" class="dock-btn primary" title="성장 시뮬레이션을 일시정지하거나 계속합니다.">
        ⏸ 일시정지
      </button>

      <button id="btn-resprout" class="dock-btn" title="씨앗 상태(0%)부터 다시 자라납니다.">
        🌱 처음부터 자라기
      </button>

      <button id="btn-mutate" class="dock-btn mutate" title="새로운 무작위 유전 시드를 생성하여 다른 형태로 자라게 합니다.">
        🎲 새로운 돌연변이
      </button>

      <div class="growth-scrubber" title="성장 진행도를 수동으로 탐색합니다.">
        <span>성장:</span>
        <input type="range" id="slider-growth-progress" min="0" max="1" step="0.001" value="1">
        <span id="val-growth-progress" class="control-value-badge" style="width: 44px; text-align: center;">100%</span>
      </div>
    </div>

    <!-- View Controls (Bottom Right - Hidden) -->
    <div id="view-controls" style="display: none;">
      <button id="btn-zoom-in" class="icon-btn" data-tooltip="확대 (+)">🔍+</button>
      <button id="btn-zoom-out" class="icon-btn" data-tooltip="축소 (-)">🔍-</button>
      <button id="btn-reset-view" class="icon-btn" data-tooltip="화면 중앙 맞추기">🎯</button>
      <button id="btn-capture" class="icon-btn" data-tooltip="고화질 PNG 이미지 저장">📸</button>
    </div>
  </div>

  <!-- Load Lindenmayer.js from local file with CDN fallback -->
  <script src="lindenmayer.browser.js"></script>
  <script>
    if (typeof LSystem === 'undefined') {
      console.warn('Local lindenmayer.browser.js not found, loading from CDN...');
      document.write('<script src="https://cdn.jsdelivr.net/npm/lindenmayer@1.5.4/dist/lindenmayer.browser.js"><\/script>');
    }
  </script>

  <!-- Application Scripts -->
  <script src="presets.js"></script>
  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
